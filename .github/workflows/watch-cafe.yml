name: PUBG 공식카페 게시판 감시

on:
  schedule:
    # 매 5분마다 실행 (GitHub 사양상 정확히 10분 간격이 아니라 다소 지연될 수 있음)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼으로도 테스트 가능

permissions:
  contents: write   # 상태 파일(state/last_article_id.txt) 커밋을 위해 필요

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 게시판 확인 및 Slack 전송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/watch_cafe.py

      - name: 상태 파일 변경 사항 커밋
        run: |
          git config user.name "cafe-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/last_article_id.txt
          git diff --staged --quiet || git commit -m "상태 갱신: 마지막 확인 글 번호 업데이트"
          git push
